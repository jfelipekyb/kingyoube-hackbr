services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cbs
      POSTGRES_PASSWORD: cbs_local_dev
      POSTGRES_DB: cbs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbs -d cbs"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
